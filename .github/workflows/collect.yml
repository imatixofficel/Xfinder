name: Xfinder Auto Update

run-name: "Xfinder update (${{ github.event_name }})"

on:
  # پشتیبان: زمان‌بندی خود GitHub (گاهی دیر اجرا می‌شود)
  schedule:
    - cron: "*/10 * * * *"
  # فراخوانی از بیرون (cron-job.org و ...) با API — ساده‌ترین روش:
  #   POST https://api.github.com/repos/imatixofficel/Xfinder/dispatches
  #   body: {"event_type":"xfinder-run"}
  repository_dispatch:
    types: [xfinder-run, run, update]
  # فراخوانی از بیرون با API — روش دوم (ref لازم است):
  #   POST https://api.github.com/repos/imatixofficel/Xfinder/actions/workflows/collect.yml/dispatches
  #   body: {"ref":"main"}
  workflow_dispatch:
    inputs:
      budget:
        description: "بودجه‌ی زمانی پایپ‌لاین (ثانیه)"
        required: false
        default: "520"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xfinder-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y curl unzip ca-certificates

      - name: Install Xray-core
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 \
            -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          rm -rf /tmp/xray && mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          install -m 0755 /tmp/xray/xray "$RUNNER_TEMP/xray"
          "$RUNNER_TEMP/xray" version

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Run collector, scanner, remix and real Xray validation
        timeout-minutes: 12
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XRAY_BIN: ${{ runner.temp }}/xray
          XRAY_PARALLEL: "4"
          XRAY_BATCH_SIZE: "32"
          XRAY_PROBE_TIMEOUT: "5"
          # منابع WireGuard (چند URL با ویرگول). منبع زنده بود (فرمت wireguard://کلید@IP:پورت)؛ هر خط با Xray واقعی تست می‌شود.
          WG_SOURCE_URLS: "https://raw.githubusercontent.com/wiki/gfpcom/free-proxy-list/lists/wireguard.txt"
          MAX_WG_CANDIDATES: "96"
          PIPELINE_BUDGET: ${{ github.event.inputs.budget || '520' }}
        run: python -m src.main

      - name: Build clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets _site/data _site/output
          cp index.html manifest.webmanifest sw.js favicon.ico _site/
          cp -R assets/* _site/assets/
          cp -R data/* _site/data/
          cp -R output/* _site/output/
          touch _site/.nojekyll
          # Never deploy source control metadata or local caches.
          rm -rf _site/data/warp_accounts.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
