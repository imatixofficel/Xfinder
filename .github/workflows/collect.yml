name: Xfinder Auto Update
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: xfinder-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/main.py
      - name: Commit generated data
        run: |
          git config user.name 'Xfinder Bot'
          git config user.email 'bot@xfinder.dev'
          git add data/ output/
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m "chore: update generated data"
            git push
          fi
