name: Xfinder Auto Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run collector pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m src.main
      - name: Commit generated data
        run: |
          git config user.name "Xfinder Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/ sources.db
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Xfinder data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
