name: Xfinder Auto Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xfinder-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y curl unzip ca-certificates

      - name: Install Xray-core
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 \
            -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          rm -rf /tmp/xray && mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          install -m 0755 /tmp/xray/xray "$RUNNER_TEMP/xray"
          "$RUNNER_TEMP/xray" version

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Run collector, scanner, remix and real Xray validation
        env:
          XRAY_BIN: ${{ runner.temp }}/xray
          XRAY_CONCURRENCY: "32"
          XRAY_BATCH_SIZE: "32"
          XRAY_PROBE_TIMEOUT: "5"
        run: python -m src.main

      - name: Build clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets _site/data _site/output
          cp index.html _site/
          cp -R assets/* _site/assets/
          cp -R data/* _site/data/
          cp -R output/* _site/output/
          touch _site/.nojekyll
          # Never deploy source control metadata or local caches.
          rm -rf _site/data/warp_accounts.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
